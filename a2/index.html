<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>A2 Biology Simulation</title>
  <style>
    :root{--navy:#12364d;--blue:#2f6f95;--pale:#eef5f8;--paper:#fff;--ink:#18303f;--muted:#60727d;--line:#d7e2e8;--shadow:0 18px 50px rgba(18,54,77,.10);--green:#2f6c42}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(180deg,#f4f8fa,#eaf1f5);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .card{width:min(760px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.bar{height:8px;background:var(--navy)}.content{padding:46px 40px 40px;text-align:center}
    .badge{display:inline-block;margin-bottom:18px;padding:7px 11px;border-radius:999px;background:var(--pale);color:var(--blue);font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3rem);line-height:1.1}.chapter{margin:18px 0 0;color:var(--blue);font-size:.95rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.title{margin:8px auto 0;max-width:580px;color:var(--ink);font-size:1.25rem;font-weight:700;line-height:1.35}
    .status{margin:24px auto 0;max-width:560px;padding:18px 20px;border:1px solid #b8d8c1;border-radius:12px;background:#eef8f0;color:#315b3a;line-height:1.55}
    .btn{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}.btn:hover{filter:brightness(.95)}
    .small{margin:18px 0 0;color:var(--muted);font-size:.9rem}footer{padding:18px 24px;border-top:1px solid var(--line);text-align:center;color:#7a8a93;font-size:.82rem}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="bar"></div>
    <section class="content">
      <span class="badge">A2 Biology</span>
      <h1 id="page-title">Simulation Portal</h1>
      <p class="chapter">Chapter 13 · Photosynthesis</p>
      <p class="title">Effect of Light Wavelength on the Hill Reaction</p>
      <div class="status"><strong>Current simulation available.</strong><br>Open the activity only when instructed by your teacher.</div>
      <a class="btn" href="chapter-13-photosynthesis/hill-reaction/">Open current simulation</a>
      <p class="small">Only the current A2 simulation is shown here.</p>
    </section>
    <footer>Mr. Roel Ruiz · Biology</footer>
  </main>
</body>
</html>
