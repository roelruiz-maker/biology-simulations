<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Biology Interactive Simulations</title>
  <style>
    :root {
      --navy:#12364d;
      --blue:#2f6f95;
      --pale:#eef5f8;
      --paper:#ffffff;
      --ink:#18303f;
      --muted:#60727d;
      --line:#d7e2e8;
      --shadow:0 18px 50px rgba(18,54,77,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      background:linear-gradient(180deg,#f4f8fa 0%,#eaf1f5 100%);
      color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
    }
    .card{
      width:min(760px,100%);
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .bar{height:8px;background:var(--navy)}
    .content{padding:48px 42px 42px;text-align:center}
    .mark{
      width:68px;height:68px;margin:0 auto 20px;
      display:grid;place-items:center;
      border-radius:16px;
      background:var(--pale);
      color:var(--navy);
      font-weight:800;
      font-size:1.35rem;
      letter-spacing:.04em;
    }
    .eyebrow{
      margin:0 0 10px;
      color:var(--blue);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    h1{margin:0;color:var(--navy);font-size:clamp(1.9rem,5vw,3rem);line-height:1.08}
    .lede{max-width:560px;margin:16px auto 0;color:var(--muted);font-size:1.04rem;line-height:1.6}
    .notice{
      margin:30px auto 0;
      max-width:560px;
      padding:17px 20px;
      border:1px solid #c7dbe5;
      border-radius:12px;
      background:var(--pale);
      color:#355566;
      line-height:1.5;
    }
    footer{padding:18px 24px;border-top:1px solid var(--line);text-align:center;color:#7a8a93;font-size:.82rem}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="bar"></div>
    <section class="content">
      <div class="mark" aria-hidden="true">BIO</div>
      <p class="eyebrow">Interactive Learning</p>
      <h1 id="page-title">Biology Interactive Simulations</h1>
      <p class="lede">Class simulations are released only when they are ready for use.</p>
      <div class="notice"><strong>Students:</strong> use the class link provided by your teacher.</div>
    </section>
    <footer>Mr. Roel Ruiz · Biology</footer>
  </main>
</body>
</html>
