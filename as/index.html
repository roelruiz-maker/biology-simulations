<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AS Biology Simulation</title>
  <style>
    :root{--navy:#12364d;--blue:#2f6f95;--pale:#eef5f8;--paper:#fff;--ink:#18303f;--muted:#60727d;--line:#d7e2e8;--shadow:0 18px 50px rgba(18,54,77,.10)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(180deg,#f4f8fa,#eaf1f5);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .card{width:min(720px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.bar{height:8px;background:var(--navy)}.content{padding:46px 40px 40px;text-align:center}
    .badge{display:inline-block;margin-bottom:18px;padding:7px 11px;border-radius:999px;background:var(--pale);color:var(--blue);font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3rem);line-height:1.1}.status{margin:22px auto 0;max-width:520px;padding:18px 20px;border:1px solid #c7dbe5;border-radius:12px;background:var(--pale);color:#355566;line-height:1.55}.small{margin:18px 0 0;color:var(--muted);font-size:.9rem}footer{padding:18px 24px;border-top:1px solid var(--line);text-align:center;color:#7a8a93;font-size:.82rem}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="bar"></div>
    <section class="content">
      <span class="badge">AS Biology</span>
      <h1 id="page-title">Simulation Portal</h1>
      <div class="status"><strong>No simulation is currently available.</strong><br>Return to this page when your teacher tells you that a simulation has been released.</div>
      <p class="small">This page will automatically be replaced by the current class simulation when needed.</p>
    </section>
    <footer>Mr. Roel Ruiz · Biology</footer>
  </main>
</body>
</html>
